name: blender test
on:
  push:
    branches: [blender-test]
    paths: [blender/**, .github/workflows/blender-test.yml]
permissions:
  contents: write
jobs:
  still:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libxkbcommon0 libsm6 > /dev/null
          curl -sL https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz | tar xJ -C $HOME
          sudo ln -sf $HOME/blender-4.2.3-linux-x64/blender /usr/local/bin/blender
          blender --version | head -1
      - name: Render still
        run: |
          mkdir -p blender/out
          /usr/bin/time -v blender -b -P blender/still.py -- $PWD/blender/out/still.png 2>&1 | grep -E "WROTE|Elapsed|Error|Traceback|Fra:" | tail -15
      - name: Save result
        run: |
          git config user.name "render-bot"; git config user.email "render-bot@users.noreply.github.com"
          git add -f blender/out/still.png && git commit -m "blender still" && git push
