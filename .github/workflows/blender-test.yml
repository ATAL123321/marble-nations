name: blender test
on:
  push:
    branches: [blender-test]
    paths: [blender/**, .github/workflows/blender-test.yml]
permissions:
  contents: write
jobs:
  still:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender > /dev/null
          blender --version | head -1
      - name: Render still
        run: |
          mkdir -p blender/out
          /usr/bin/time -v blender -b -P blender/still.py -- $PWD/blender/out/still.png 2>&1 | grep -E "WROTE|Elapsed|Error|Traceback|Fra:" | tail -15
      - name: Save result
        run: |
          git config user.name "render-bot"; git config user.email "render-bot@users.noreply.github.com"
          git add blender/out/still.png && git commit -m "blender still" && git push
