name: voice samples
on:
  push:
    branches: [voice-samples]
    paths: [voice/make.py, .github/workflows/voices.yml]
permissions:
  contents: write
jobs:
  make:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: sudo apt-get update -q && sudo apt-get install -y -q espeak-ng ffmpeg
      - run: pip install -q "kokoro>=0.9" soundfile
      - run: mkdir -p voice/samples && python voice/make.py
      - run: |
          git config user.name "voice-bot"; git config user.email "voice-bot@users.noreply.github.com"
          git add voice/samples/*.mp3 && git commit -m "voice samples" && git push
